<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord Runner 🎸</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- START SCREEN -->
  <div id="start-screen">
    <h1>CHORD RUNNER 🎸</h1>
    <p class="subtitle">An endless runner powered by real guitar chords</p>
    <button id="start-btn">Start Game</button>
  </div>

  <!-- GAME SCREEN (hidden until Start is clicked) -->
  <div id="game-screen" class="hidden">

    <!-- TOP HUD: score, combo, lives -->
    <div id="hud">
      <div class="hud-item">
        <span class="hud-label">SCORE</span>
        <span id="score" class="hud-value">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">COMBO</span>
        <span id="combo" class="hud-value">x0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">LIVES</span>
        <span id="lives" class="hud-value">❤️❤️❤️</span>
      </div>
      <button id="pause-btn">⏸ Pause</button>
    </div>

    <!-- CHORD PANEL: current chord + diagram -->
    <div id="chord-panel">
      <p class="play-label">PLAY THIS CHORD</p>
      <h2 id="chord-name">C MAJOR</h2>
      <div id="chord-diagram">
        <p class="placeholder-text">[Chord Diagram]</p>
      </div>
    </div>

    <!-- GAME AREA: canvas lives here -->
    <div id="game-area">
      <canvas id="game-canvas" width="860" height="350"></canvas>
    </div>

    <!-- GAME OVER OVERLAY -->
    <div id="gameover-screen" class="hidden">
      <h2>GAME OVER</h2>
      <p>Score: <span id="final-score">0</span></p>
      <p>High Score: <span id="final-highscore">0</span></p>
      <button id="restart-btn">Restart</button>
    </div>

  </div>

   <script src="chord.js"></script>
  <script src="chordDiagram.js"></script>
  <script src="script.js"></script>
</body>
</html>
